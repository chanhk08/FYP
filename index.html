<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeachKit Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-shell="gate">
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="brand" id="brand">
        <span class="brand-mark">TK</span>
        <div>
          <strong id="brand-title">TeachKit</strong>
          <small id="brand-sub">Choose an interface</small>
        </div>
      </div>
      <span class="shell-role-pill" id="shell-role-pill" hidden aria-live="polite">Role</span>
      <div class="context-chip is-hidden" id="context-chip" hidden>Prototype</div>
      <nav class="top-nav" id="top-nav"></nav>
    </header>
    <main id="root"></main>
  </div>

  <button type="button" id="btn-mobile-toggle" class="mobile-fab is-hidden" aria-pressed="false">
    Phone view
  </button>
  <button type="button" id="btn-exit-shell" class="exit-fab is-hidden" data-go="role-pick">
    Navigator
  </button>

  <div class="ai-check-dock is-hidden" id="ai-check-dock" hidden>
    <div class="ai-check-panel is-hidden" id="ai-check-bot" hidden>
      <div class="ai-check-bot-head">
        <span class="bubble-avatar ai" aria-hidden="true"></span>
        <div class="ai-check-bot-titles">
          <strong>AI assistant</strong>
          <p>Ask schedule · create/edit sessions · syllabus</p>
        </div>
        <button type="button" class="q-editor-remove" id="btn-ai-check-minimize" aria-label="Minimize" title="Minimize">×</button>
      </div>
      <div class="ai-check-chips" id="ai-check-chips">
        <button type="button" class="ai-chip" data-ai-prompt="What classes this week?">What classes this week?</button>
        <button type="button" class="ai-chip" data-ai-prompt="Add Week 6 session · PID tuning">Add Week 6</button>
        <button type="button" class="ai-chip" data-ai-prompt="Change today's topic to Mid-term review">Change today’s topic</button>
        <button type="button" class="ai-chip" data-ai-prompt="help">What can you do?</button>
      </div>
      <div class="ai-check-log" id="ai-check-log" aria-live="polite"></div>
      <form class="ai-check-composer" id="form-ai-check">
        <label class="ai-attach" title="Attach syllabus (optional)">
          <input type="file" id="ai-check-file" accept=".pdf,.doc,.docx,.txt,application/pdf,text/plain" hidden />
          <span aria-hidden="true">＋</span>
        </label>
        <input name="msg" type="text" id="ai-check-input" placeholder="Command or question…" autocomplete="off" />
        <button class="btn small primary" type="submit">Send</button>
      </form>
      <p class="hint" id="ai-check-attach-hint" hidden></p>
    </div>
    <button type="button" class="ai-check-fab" id="btn-ai-check-toggle" aria-expanded="false" aria-controls="ai-check-bot">
      <span class="bubble-avatar ai" aria-hidden="true"></span>
      <span>AI assistant</span>
    </button>
  </div>

  <!-- Entry -->
  <template id="tpl-role-pick">
    <section class="screen role-pick">
      <div class="screen-head">
        <p class="eyebrow">TeachKit</p>
        <h1>Start</h1>
        <p class="muted">Pick a side to start; switch Teacher / Student anytime from the top-right.</p>
      </div>
      <div class="choice-stack role-choices">
        <button type="button" class="choice-card" data-go="navigator">
          <strong>Teacher</strong>
          <span>Start in Workspace; use the top-right for Live or switch to Student.</span>
        </button>
        <button type="button" class="choice-card" data-go="student-join">
          <strong>Student</strong>
          <span>Start in In-class; use the top-right for Pre-class or switch to Teacher.</span>
        </button>
      </div>
      <div class="tour-entry">
        <button type="button" class="btn primary" id="btn-start-tour">Start tour · How to use TeachKit</button>
        <p class="hint">About 1 minute · walks through teacher prep/Live and student join</p>
      </div>
    </section>
  </template>

  <!-- TEACHER WORKSPACE -->
  <template id="tpl-navigator">
    <section class="screen nav-screen">
      <div class="screen-head">
        <p class="eyebrow">Teacher · Workspace</p>
        <h1>Your teaching workspace</h1>
        <p class="muted">Pick a course, then a section, then a session. Open a session to prepare slides &amp; questions.</p>
      </div>

      <div class="nav-layout">
        <aside class="panel course-list">
          <div class="list-head">
            <h2>Courses</h2>
            <button type="button" class="btn small" data-go="create-course">Add</button>
          </div>
          <div class="course-items" id="course-items"></div>
        </aside>

        <div class="panel">
          <div class="nav-main-head">
            <p class="eyebrow" id="nav-course-code">EE3001</p>
            <h2 id="nav-course-title">Feedback Control</h2>
          </div>
          <div class="session-head section-block-head">
            <h3 class="list-title">Sections</h3>
            <button type="button" class="btn small" data-go="create-section">Add</button>
          </div>
          <div class="section-tabs" id="section-tabs"></div>
          <div class="session-head">
            <h3 class="list-title">Sessions</h3>
            <button type="button" class="btn small" data-go="create-session">Add</button>
          </div>
          <div class="session-list" id="session-list"></div>
        </div>
      </div>
    </section>
  </template>

  <!-- CREATE COURSE -->
  <template id="tpl-create-course">
    <section class="screen narrow-form">
      <p class="eyebrow">Create</p>
      <h1>New course</h1>
      <p class="muted">Creating a course also creates the first Section (add L02 later if needed).</p>
      <form class="panel form-stack" id="form-create-course">
        <label class="field"><span>Course code</span><input name="code" placeholder="e.g. EE3002" required /></label>
        <label class="field"><span>Course name</span><input name="title" placeholder="e.g. Digital Control" required /></label>
        <label class="field"><span>First section</span><input name="section" placeholder="e.g. L01" value="L01" required /></label>
        <label class="field"><span>Section time / room</span><input name="meta" placeholder="e.g. Tue 10:30 · PQ305" /></label>
        <div class="cta-row">
          <button type="submit" class="btn primary">Create course</button>
          <button type="button" class="btn" data-go="navigator">Cancel</button>
        </div>
      </form>
    </section>
  </template>

  <!-- CREATE SECTION -->
  <template id="tpl-create-section">
    <section class="screen narrow-form">
      <p class="eyebrow">Create</p>
      <h1>New section</h1>
      <p class="muted">Add another class section to this course (L02, L03…). Each has its own session list.</p>
      <p class="context-line" id="create-section-course"></p>
      <form class="panel form-stack" id="form-create-section">
        <label class="field"><span>Section code</span><input name="label" placeholder="e.g. L02" required /></label>
        <label class="field"><span>Time</span><input name="time" type="time" value="14:30" required /></label>
        <label class="field"><span>Total students</span><input name="students" type="number" min="1" step="1" placeholder="e.g. 42" required /></label>
        <label class="field"><span>Description</span><input name="description" placeholder="e.g. Tue · FJ304" /></label>
        <div class="cta-row">
          <button type="submit" class="btn primary">Create section</button>
          <button type="button" class="btn" data-go="navigator">Cancel</button>
        </div>
      </form>
    </section>
  </template>

  <!-- CREATE SESSION -->
  <template id="tpl-create-session">
    <section class="screen narrow-form">
      <p class="eyebrow">Create</p>
      <h1>New session</h1>
      <p class="muted">Add a session to the selected Course + Section. Time defaults to the Section time.</p>
      <p class="context-line" data-context></p>
      <form class="panel form-stack" id="form-create-session">
        <label class="field"><span>Topic</span><input name="topic" placeholder="e.g. PID design sketch" required /></label>
        <label class="field"><span>Week number</span><input name="week" type="number" min="1" step="1" placeholder="e.g. 5" required /></label>
        <label class="field"><span>Date</span><input name="date" type="date" required /></label>
        <label class="field"><span>Time</span><input name="time" type="time" id="create-session-time" required /></label>
        <div class="cta-row">
          <button type="submit" class="btn primary">Create session</button>
          <button type="button" class="btn" data-go="navigator">Cancel</button>
        </div>
      </form>
    </section>
  </template>

  <!-- HOME / FLOW -->
  <template id="tpl-home">
    <section class="screen hero">
      <p class="eyebrow">Session flow (after you pick a class in Navigator)</p>
      <h1>What happens inside one lesson</h1>
      <p class="lede">
        Navigator chooses <em>which</em> course / week. These screens show the layout inside that session.
        Chat accepts any text; replies stay on the scripted path.
      </p>
      <div class="cta-row">
        <button type="button" class="btn primary" data-go="navigator">Open Navigator</button>
        <button type="button" class="btn demo" data-go="teacher-prep">Teacher path</button>
        <button type="button" class="btn demo" data-go="student-join">Student path</button>
      </div>
      <div class="card-grid three">
        <article class="info-card"><h3>Pre-class</h3><p>Slides + questions · 1-to-1 AI · insight card</p></article>
        <article class="info-card"><h3>Live class</h3><p>QR lobby · group chat · health lights</p></article>
        <article class="info-card"><h3>Records</h3><p>Past weeks sit in the same session list</p></article>
      </div>
    </section>
  </template>

  <template id="tpl-teacher-prep">
    <section class="screen narrow-form prep-screen">
      <p class="eyebrow">Teacher · before class</p>
      <h1>Session prep</h1>

      <div class="readonly-block">
        <p class="field-label">This session</p>
        <p class="readonly-value" data-context></p>
        <p class="field-hint">Taken from the Course / Section / Week selected in Navigator — no need to re-enter.</p>
      </div>

      <form id="form-session-prep" class="panel form-stack prep-form">
        <div class="field">
          <span class="field-label">1. Lecture slides (optional)</span>
          <p class="field-hint">Upload a <strong>.ppt</strong> / <strong>.pptx</strong>; in this prototype you can also skip and just walk through the flow.</p>
          <label class="file-pick">
            <input type="file" id="prep-pptx" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" />
            <span class="file-pick-ui">
              <strong>Choose PowerPoint…</strong>
              <small id="prep-file-name">No file selected (optional)</small>
            </span>
          </label>
        </div>

        <div class="field">
          <span class="field-label">2. Pre-class questions (add multiple)</span>
          <p class="field-hint">Write each question clearly and note the linked slide pages (e.g. 4–6).</p>
          <div class="stack-gap" id="prep-questions">
            <div class="q-editor" data-q="1">
              <div class="q-editor-head">
                <strong>Q1</strong>
                <span class="q-summary"></span>
                <button type="button" class="item-fold" aria-expanded="true" title="Collapse">−</button>
                <button type="button" class="q-editor-remove" aria-label="Remove question" title="Remove">×</button>
              </div>
              <div class="q-body">
                <label class="field tight">
                  <span>Question text</span>
                  <textarea name="q1_text" rows="2" placeholder="e.g. Why might high proportional gain cause oscillation?" required>Why might high proportional gain cause oscillation?</textarea>
                </label>
                <label class="field tight">
                  <span>Linked slides</span>
                  <input name="q1_slides" type="text" placeholder="e.g. 4–6" value="4–6" required />
                </label>
              </div>
            </div>
            <div class="q-editor" data-q="2">
              <div class="q-editor-head">
                <strong>Q2</strong>
                <span class="q-summary"></span>
                <button type="button" class="item-fold" aria-expanded="true" title="Collapse">−</button>
                <button type="button" class="q-editor-remove" aria-label="Remove question" title="Remove">×</button>
              </div>
              <div class="q-body">
                <label class="field tight">
                  <span>Question text</span>
                  <textarea name="q2_text" rows="2" placeholder="e.g. Give one real-world example where overshoot is costly." required>Give one real-world example where overshoot is costly.</textarea>
                </label>
                <label class="field tight">
                  <span>Linked slides</span>
                  <input name="q2_slides" type="text" placeholder="e.g. 7–8" value="7–8" required />
                </label>
              </div>
            </div>
          </div>
          <button type="button" class="btn small" id="btn-add-preq">+ Add another question</button>
        </div>

        <div class="field">
          <span class="field-label">3. In-class activities (multiple · drag to reorder · used in Live)</span>
          <p class="field-hint">Drag <strong>☰</strong> to reorder. Add Discussion, Poll, Q&A, Canvas, Word cloud, or Quiz; Live follows this order.</p>
          <div class="stack-gap" id="prep-activities"></div>
          <button type="button" class="btn small" id="btn-add-activity-prep">+ Add another activity</button>

          <div class="modal-backdrop is-hidden" id="prep-activity-type-modal" hidden>
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="prep-act-type-title">
              <div class="modal-head">
                <h2 id="prep-act-type-title">Add activity</h2>
                <button type="button" class="q-editor-remove" id="btn-close-prep-act-type" aria-label="Close" title="Close">×</button>
              </div>
              <p class="field-hint">Pick an activity type to add (more types can be added later).</p>
              <div class="act-type-list" id="prep-act-type-list" role="list"></div>
              <div class="cta-row prep-actions">
                <button type="button" class="btn" id="btn-cancel-prep-act-type">Cancel</button>
              </div>
            </div>
          </div>
        </div>

        <div class="cta-row prep-actions">
          <button type="submit" class="btn primary">Save &amp; get link</button>
          <button type="button" class="btn" data-go="teacher-live">Live console</button>
          <button type="button" class="btn" data-go="navigator">Workspace</button>
        </div>

        <div class="prep-link-box is-hidden" id="prep-link-box" hidden>
          <p class="field-label">Pre-class link for students</p>
          <p class="field-hint">Saving creates a Pre-class link and locks in-class activities for Live.</p>
          <div class="link-row">
            <input type="text" id="prep-share-link" readonly />
            <button type="button" class="btn small primary" id="btn-copy-prep-link">Copy</button>
          </div>
          <p class="hint" id="prep-copy-msg" hidden>Copied.</p>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-student-join">
    <section class="screen narrow">
      <p class="eyebrow">Student · Chat room</p>
      <h1>Scan classroom QR</h1>
      <p class="muted">Before joining class discussion, scan the classroom QR on your phone (this prototype uses a button instead).</p>
      <p class="context-line" data-context></p>
      <div class="qr"></div>
      <p class="muted">Session code <strong>CTRL-4F</strong></p>
      <div class="cta-row center">
        <button type="button" class="btn primary" data-go="student-lobby">I’ve scanned · enter lobby</button>
      </div>
    </section>
  </template>

  <template id="tpl-student-preclass-entry">
    <section class="screen narrow-form">
      <p class="eyebrow">Student · Pre-class</p>
      <h1>Before you start</h1>
      <p class="muted">Enter a few details, then view slides and answer questions — no separate PowerPoint needed.</p>
      <p class="context-line" data-context></p>
      <form class="panel form-stack" id="form-preclass-entry">
        <label class="field">
          <span>Display name</span>
          <input name="name" placeholder="e.g. Alex" required />
        </label>
        <label class="field">
          <span>Student ID</span>
          <input name="sid" placeholder="e.g. 23001234D" required />
        </label>
        <label class="field">
          <span>How are you joining?</span>
          <select name="place" required>
            <option value="commute">On the way to campus</option>
            <option value="home">At home / dorm</option>
            <option value="campus">Already on campus</option>
          </select>
        </label>
        <div class="cta-row">
          <button type="submit" class="btn primary">Enter pre-class</button>
        </div>
        <p class="hint">Data is for this prototype only; a real system can be anonymous / encrypted.</p>
      </form>
    </section>
  </template>

  <template id="tpl-student-preclass">
    <section class="screen preclass-screen">
      <header class="preclass-top">
        <div>
          <p class="eyebrow">Student · pre-class · on the go</p>
          <h1>Think before lecture</h1>
          <p class="context-line" data-context></p>
          <p class="muted" id="preclass-who"></p>
        </div>
        <button type="button" class="btn" data-go="student-preclass-entry">Back to entry</button>
      </header>

      <div class="q-pills" id="preq-pills">
        <button type="button" class="q-pill on" data-q="0">Q1</button>
        <button type="button" class="q-pill" data-q="1">Q2</button>
      </div>

      <div class="preclass-grid">
        <div class="panel slide-panel">
          <div class="slide-toolbar">
            <strong id="preq-slides">Slides 4–6</strong>
            <span class="slide-page" id="slide-page-label">4 / 6</span>
          </div>
          <div class="slide-stage" id="slide-stage" aria-live="polite">
            <!-- filled by JS -->
          </div>
          <div class="slide-nav">
            <button type="button" class="btn small" id="slide-prev">Previous</button>
            <button type="button" class="btn small" id="slide-next">Next</button>
          </div>
          <p class="hint slide-hint">Slides are embedded here — no separate PowerPoint; works on the phone on the go.</p>
        </div>

        <div class="panel chat-panel preclass-chat">
          <div class="slide-ref">
            <p id="preq-prompt">Why might high proportional gain cause oscillation?</p>
          </div>
          <div class="chat-log" id="log-pre"></div>
          <form class="composer" data-script="preclass">
            <input name="msg" placeholder="Type your thoughts…" autocomplete="off" />
            <button class="btn primary small" type="submit">Send</button>
          </form>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-teacher-insight">
    <section class="screen">
      <div class="screen-head">
        <p class="eyebrow">Teacher · project in class / past record</p>
        <h1 id="insight-heading">Class insight card · Q1</h1>
        <p class="context-line" data-context></p>
      </div>
      <div class="insight">
        <header>
          <h2 id="insight-q">Why might high proportional gain cause oscillation?</h2>
          <span class="pill" id="insight-pill">78% · n=94</span>
        </header>
        <div class="insight-grid">
          <div><h3>Mainstream</h3><p id="insight-main">62% — fast response over-corrects and rings</p></div>
          <div><h3>Misconceptions</h3><ul id="insight-miss"><li>Higher gain always more accurate</li><li>Oscillation only from sensor noise</li></ul></div>
          <div><h3>Disagreement</h3><p id="insight-dis">Lower gain vs add derivative action</p></div>
          <div><h3>Still fuzzy</h3><p id="insight-fuzzy">Stability margin vs “looked fine in a short demo”</p></div>
        </div>
      </div>
      <div class="cta-row">
        <button type="button" class="btn primary" data-go="teacher-live">Live console</button>
        <button type="button" class="btn" data-go="record-detail">Participation record</button>
      </div>
    </section>
  </template>

  <template id="tpl-record-detail">
    <section class="screen">
      <div class="screen-head">
        <p class="eyebrow">Past record</p>
        <h1 id="record-title">Week 3 · Participation summary</h1>
        <p class="context-line" data-context></p>
      </div>
      <div class="card-grid three">
        <article class="info-card"><h3>Pre-class</h3><p id="rec-pre">74% completed thinking Q</p></article>
        <article class="info-card"><h3>Live poll</h3><p id="rec-poll">91% responded</p></article>
        <article class="info-card"><h3>Groups</h3><p id="rec-groups">10 groups · 2 amber · 1 red</p></article>
      </div>
      <div class="panel soft mt">
        <h3>Notes (mock)</h3>
        <p class="muted" id="rec-notes">Students still confused about damping. Revisit in Week 4 opener.</p>
      </div>
      <div class="cta-row">
        <button type="button" class="btn primary" data-go="teacher-insight">Open insight card</button>
      </div>
    </section>
  </template>

  <template id="tpl-student-lobby">
    <section class="screen narrow-form group-choice-screen">
      <p class="eyebrow">Student · In-class</p>
      <h1>You’re in · CTRL-4F</h1>
      <p class="context-line" data-context></p>

      <div id="lobby-waiting" class="panel soft">
        <p class="readonly-value">Waiting for teacher…</p>
        <p class="muted">When the teacher opens Discussion, Poll, Q&A, Canvas, Word cloud, or Quiz, the matching activity unlocks here.</p>
        <p class="hint">Prototype tip: open an activity in Teacher → Live, then come back here and Check again.</p>
        <div class="cta-row">
          <button type="button" class="btn small" id="btn-lobby-refresh">Check again</button>
          <button type="button" class="btn" data-go="student-join">Back to scan</button>
        </div>
      </div>

      <div id="lobby-poll" class="panel soft is-hidden" hidden>
        <p class="field-label">Poll is open</p>
        <p class="readonly-value" id="lobby-poll-question"></p>
        <p class="muted">The teacher started a poll. Enter to pick your option.</p>
        <div class="cta-row">
          <button type="button" class="btn primary" data-go="student-poll">Enter poll</button>
          <button type="button" class="btn small" id="btn-lobby-refresh-poll">Check again</button>
        </div>
      </div>

      <div id="lobby-qa" class="panel soft is-hidden" hidden>
        <p class="field-label">Q&amp;A is open</p>
        <p class="readonly-value" id="lobby-qa-prompt"></p>
        <p class="muted">Ask anonymously and upvote. Enter to take part.</p>
        <div class="cta-row">
          <button type="button" class="btn primary" data-go="student-qa">Enter Q&amp;A</button>
          <button type="button" class="btn small" id="btn-lobby-refresh-qa">Check again</button>
        </div>
      </div>

      <div id="lobby-canvas" class="panel soft is-hidden" hidden>
        <p class="field-label">Brainstorm canvas is open</p>
        <p class="readonly-value" id="lobby-canvas-prompt"></p>
        <p class="muted">Class sticky wall. Enter to add a note.</p>
        <div class="cta-row">
          <button type="button" class="btn primary" data-go="student-canvas">Enter canvas</button>
          <button type="button" class="btn small" id="btn-lobby-refresh-canvas">Check again</button>
        </div>
      </div>

      <div id="lobby-wordcloud" class="panel soft is-hidden" hidden>
        <p class="field-label">Word cloud is open</p>
        <p class="readonly-value" id="lobby-wordcloud-prompt"></p>
        <p class="muted">Submit one word or short phrase and see the live cloud.</p>
        <div class="cta-row">
          <button type="button" class="btn primary" data-go="student-wordcloud">Enter word cloud</button>
          <button type="button" class="btn small" id="btn-lobby-refresh-wordcloud">Check again</button>

              <label class="field tight">
                <span>Linked slides（optional）</span>
                <input name="wordcloud_slides" type="text" placeholder="e.g. 4–6" />
              </label>
            </div>
            <div id="modal-fields-quiz" class="is-hidden" hidden data-modal-fields="quiz">
              <label class="field tight">
                <span>Quiz question</span>
                <textarea name="quiz_question" rows="2" placeholder="MCQ for the class"></textarea>
              </label>
              <label class="field tight">
                <span>Options (one per line)</span>
                <textarea name="quiz_options" rows="4" placeholder="A&#10;B&#10;C&#10;D"></textarea>
              </label>
              <label class="field tight">
                <span>Correct option index（0 = A）</span>
                <input name="quiz_correct" type="number" min="0" value="0" />
              </label>
              <label class="field tight">
                <span>Timer（seconds）</span>
                <input name="quiz_seconds" type="number" min="5" value="30" />
              </label>
              <label class="field tight">
                <span>Linked slides（optional）</span>
                <input name="quiz_slides" type="text" placeholder="e.g. 4–6" />
              </label>
            </div>
            <div class="cta-row prep-actions">
              <button type="submit" class="btn primary">Add to list</button>
              <button type="button" class="btn" id="btn-cancel-activity-modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-teacher-scan">
    <section class="screen narrow-form scan-screen">
      <p class="eyebrow">Teacher · live · project this</p>
      <h1>Student scan</h1>
      <p class="context-line" data-context></p>
      <p class="muted">Project this for students to scan into discussion. This is the teacher view — it won’t jump to the student flow.</p>

      <div class="panel soft scan-board">
        <div class="qr qr-lg"></div>
        <p class="scan-code">CTRL-4F</p>
        <p class="field-hint">Session join code · same for the whole class</p>
      </div>

      <div class="cta-row center">
        <button type="button" class="btn primary" data-go="teacher-live">Back to Live classroom</button>
        <button type="button" class="btn" data-go="navigator">Navigator</button>
      </div>
    </section>
  </template>

  <button type="button" id="btn-tour-help" class="tour-help-fab" title="Tour" aria-label="Open guided tour">?</button>

  <div id="tour-root" class="tour-root is-hidden" hidden>
    <div class="tour-spotlight is-hidden" id="tour-spotlight" hidden aria-hidden="true"></div>
    <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">
      <div class="tour-card-top">
        <p class="tour-kicker">Tour</p>
        <span class="tour-step-label" id="tour-step-label">1 / 9</span>
      </div>
      <h2 id="tour-title">Title</h2>
      <p id="tour-body">Body</p>
      <div class="tour-actions">
        <button type="button" class="btn" id="btn-tour-skip">Skip</button>
        <div class="tour-actions-right">
          <button type="button" class="btn" id="btn-tour-back">Back</button>
          <button type="button" class="btn primary" id="btn-tour-next">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
